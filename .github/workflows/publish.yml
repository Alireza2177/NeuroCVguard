name: Publish approved release files

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/neurocvguard/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch the exact approved GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --dir dist/release --pattern '*.whl' --pattern '*.tar.gz'
      - name: Verify reviewed artifact bytes and explicit publication decision
        run: python tools/verify_release_assets.py --manifest state/release/0.1.0-artifacts.json --dist dist/release --require-authorization
      - name: Publish verified files through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/release/
          skip-existing: false
          print-hash: true
