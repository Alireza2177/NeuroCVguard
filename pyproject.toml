[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocvguard"
dynamic = ["version"]
description = "Research-only cohort audits and independently checked split plans for neuroimaging ML"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Alireza Emad"}]
maintainers = [{name = "Alireza Emad", email = "Alireza221177@gmail.com"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26.4", "pandas>=2.2.3", "scipy>=1.13.1", "scikit-learn>=1.5.2", "Jinja2>=3.1.6", "jsonschema>=4.23.0"]

[project.urls]
Source = "https://github.com/Alireza2177/NeuroCVguard"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "build", "twine", "pandas-stubs", "types-jsonschema"]
docs = ["sphinx", "myst-parser", "sphinx-rtd-theme"]

[project.scripts]
neurocvguard = "neurocvguard.__main__:main"

[tool.hatch.version]
path = "src/neurocvguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocvguard"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "neurocvguard/examples"

[tool.hatch.build.targets.sdist]
include = ["/src/neurocvguard", "/examples", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["neurocvguard"]
# CLI/tutorial tests launch real Python processes. Measure those paths as well.
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 100
# The unchanged master builder predates S00. The repaired foundation validator
# and all new stage helpers now receive the ordinary project lint/format checks.
extend-exclude = ["tools/build_master.py", ".venv-install"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# sklearn does not ship typing metadata. Restrict this exception to its import
# boundary; NeuroCVguard's participant adapters and public functions remain strict.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

# SciPy's installed contingency module has no typing metadata. Keep this
# exception at the external boundary; validate finite outputs and type our adapter.
[[tool.mypy.overrides]]
module = ["scipy.stats.contingency"]
ignore_missing_imports = true

[tool.neurocvguard.release]
proposed-license = "BSD-3-Clause"
license-status = "OWNER_CONFIRMED"
copyright-owner = "Alireza Emad"
maintainer = "Alireza Emad"
security-contact = "Alireza221177@gmail.com"
repository-url = "https://github.com/Alireza2177/NeuroCVguard"
# Selected project name; registry/publisher verification is release evidence.
package-namespace = "neurocvguard"
# Publication authorization is recorded in state/PROJECT_STATUS.json, outside
# immutable distribution metadata, and must name the reviewed artifacts.
